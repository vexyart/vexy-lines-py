# this_file: mkdocs.yml
site_name: "vexy-lines-py"
site_description: "Pure-Python parser for Vexy Lines .lines vector art files"
theme:
  custom_dir: overrides
  name: materialx
  features:
    - navigation.path
    - toc.follow
    - content.code.copy
    - navigation.sections
  palette:
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Light mode
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Dark mode
docs_dir: src_docs
site_dir: docs
markdown_extensions:
  - pymdownx.highlight:
      auto_title: true
      auto_title_map:
        Python: ""
        Bash: ""
        JSON: ""
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

plugins:
  - materialx/search
  - materialx/meta
  - materialx/tags
  - awesome-nav
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            allow_inspection: false
            docstring_style: null
            show_root_heading: true
            show_source: true
  - print-site:
      add_to_navigation: true
      print_page_title: Print this guide
